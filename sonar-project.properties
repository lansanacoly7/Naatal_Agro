# ==============================================================================
# NAATAL AGRO - SONARQUBE CONFIGURATION
# Plateforme Agricole Intelligente pour le Sénégal
# ==============================================================================

# --- Identification du projet ---
sonar.projectKey=naatal-agro
sonar.projectName=Naatal Agro
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# --- Sources & Tests ---
sonar.sources=backend/apps,mobile/lib,web/src
sonar.tests=backend/apps,mobile/test
sonar.test.inclusions=backend/apps/**/tests.py,backend/apps/**/test_*.py,mobile/test/**

# --- Exclusions globales ---
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  backend/venv/**,\
  backend/db.sqlite3,\
  backend/staticfiles/**,\
  backend/media/**,\
  mobile/build/**,\
  mobile/.dart_tool/**,\
  mobile/web/**,\
  web/node_modules/**,\
  web/dist/**,\
  docs/**,\
  scripts/**,\
  **/*.g.dart,\
  **/*.freezed.dart

# --- Exclusions du calcul de couverture (code de configuration / boilerplate) ---
sonar.coverage.exclusions=\
  **/migrations/**,\
  backend/apps/**/admin.py,\
  backend/apps/**/apps.py,\
  backend/core/**,\
  backend/manage.py,\
  backend/seed.py,\
  mobile/lib/main.dart,\
  mobile/lib/firebase_options.dart,\
  mobile/lib/core/theme/**,\
  **/*.g.dart

# --- Backend Python (Django REST Framework) ---
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- Mobile Flutter / Dart ---
sonar.dart.coverage.reportPaths=mobile/coverage/lcov.info

# --- Frontend Web (React / TypeScript) ---
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.typescript.tsconfigPath=web/tsconfig.json
