services:
  sonarqube:
    image: sonarqube:community
    container_name: naatal_sonarqube
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_secure_password_naatal
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
    ports:
      - "9000:9000"
    networks:
      - sonar-net
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonar-db:
    image: postgres:15-alpine
    container_name: naatal_sonar_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_secure_password_naatal
      POSTGRES_DB: sonar
    networks:
      - sonar-net
    volumes:
      - sonar_postgresql:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  sonar-net:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_postgresql:
