<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nataal_agro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Naatal Agro — Copilote Agricole Intelligent</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F4F6F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F4F6F8;
      z-index: 999999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .splash-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(27, 94, 32, 0.15);
      border-top-color: #1B5E20;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }
    .splash-title {
      margin-top: 24px;
      font-size: 22px;
      font-weight: 700;
      color: #1B5E20;
      letter-spacing: -0.5px;
    }
    .splash-subtitle {
      margin-top: 8px;
      font-size: 14px;
      color: #8E8E93;
      font-weight: 500;
    }
    .splash-error { color: #B3261E; max-width: 320px; line-height: 1.4; }
    .splash-retry {
      margin-top: 20px;
      padding: 10px 24px;
      border: 0;
      border-radius: 10px;
      background: #1B5E20;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-spinner"></div>
      <div class="splash-title">Naatal Agro</div>
      <div class="splash-subtitle">Chargement de la plateforme agricole...</div>
    </div>
  </div>

  <script>
    function removeSplashScreen() {
      var splash = document.getElementById('splash-screen');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }
    }

    // 1. Détection via l'événement officiel Flutter Web
    window.addEventListener('flutter-first-frame', removeSplashScreen);

    // 2. Détection par insertion du moteur Flutter dans le DOM (flutter-view ou canvas)
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        setTimeout(removeSplashScreen, 100);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Échec de démarrage : on n'efface JAMAIS le splash en silence (écran blanc),
    //    on affiche un message d'erreur et un bouton pour réessayer.
    function showStartupError(detail) {
      var splash = document.getElementById('splash-screen');
      if (!splash) return;
      if (observer) observer.disconnect();
      if (detail) console.error('[Naatal Agro] Échec du démarrage : ' + detail);
      var content = splash.querySelector('.splash-content');
      content.innerHTML =
        '<div class="splash-title">Naatal Agro</div>' +
        '<div class="splash-subtitle splash-error">Impossible de démarrer l’application. ' +
        'Vérifiez votre connexion puis réessayez.</div>' +
        '<button class="splash-retry" onclick="window.location.reload()">Réessayer</button>';
    }

    window.addEventListener('error', function(event) {
      if (document.getElementById('splash-screen')) showStartupError(event.message);
    });
    window.addEventListener('unhandledrejection', function(event) {
      if (document.getElementById('splash-screen')) showStartupError(String(event.reason));
    });
    // Délai maximal de démarrage (réseau lent compris)
    setTimeout(function() {
      if (document.getElementById('splash-screen')) showStartupError('délai de démarrage dépassé');
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js" async onerror="showStartupError('flutter_bootstrap.js introuvable')"></script>
</body>
</html>
