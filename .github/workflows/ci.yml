name: Naatal Agro CI Pipeline

on:
  push:
    branches: [ "main", "develop", "test" ]
  pull_request:
    branches: [ "main", "develop", "test" ]

jobs:
  backend-test:
    name: Backend Django Tests & Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: |
          cd backend
          python manage.py check

      - name: Migrations à jour (aucune migration oubliée)
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Contrôle de déploiement (settings de production)
        env:
          SECRET_KEY: ci-only-secret-key-for-deploy-check-0123456789-abcdefghijklmnopqrstuvwxyz
        run: |
          cd backend
          python manage.py check --deploy --settings=core.settings.prod

      - name: Run Backend Tests with Coverage
        run: |
          cd backend
          coverage run --source='apps' manage.py test
          coverage xml -o coverage.xml
          coverage report -m

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  flutter-test:
    name: Flutter Mobile Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Flutter Linter Analysis
        run: |
          cd mobile
          flutter analyze lib

      - name: Run Flutter Widget Tests with Coverage
        run: |
          cd mobile
          flutter test --coverage

      - name: Upload Flutter Coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info

  web-build:
    name: Web React Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install & Build
        run: |
          cd web
          npm ci
          npm run build

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-test, flutter-test, web-build]
    if: always() && (needs.backend-test.result == 'success') && (needs.flutter-test.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download Flutter Coverage
        uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: mobile/coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true
