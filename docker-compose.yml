services:
  db:
    image: postgres:16-alpine
    container_name: naatal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-naatal_agro_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-naatal_agro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naatal_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY est obligatoire (voir .env.example)}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,naatal_backend,nginx,naatal-agro.sn}
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-naatal_agro_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD est obligatoire (voir .env.example)}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://naatal-agro.sn}
      - API_KEY_OPENWEATHER=${API_KEY_OPENWEATHER:-}
      - API_KEY_GROQ=${API_KEY_GROQ:-}
      - API_KEY_GEMINI=${API_KEY_GEMINI:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - CACHE_BACKEND=db
      - SECURE_SSL_REDIRECT=False
    volumes:
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 core.wsgi:application"

  # Délivre les rappels programmés arrivés à échéance (et envoie le push Firebase si disponible), et rattrape les
  # conseils de stockage de l'IA restés manquants.
  # Sans ce service, les rappels sont tout de même délivrés quand l'utilisateur ouvre ses notifications.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naatal_scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY est obligatoire (voir .env.example)}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,naatal_backend,nginx,naatal-agro.sn}
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-naatal_agro_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD est obligatoire (voir .env.example)}
      - DB_HOST=db
      - DB_PORT=5432
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - CACHE_BACKEND=db
      - API_KEY_GROQ=${API_KEY_GROQ:-}
      - API_KEY_GEMINI=${API_KEY_GEMINI:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
    command: >
      sh -c "while true; do python manage.py send_scheduled_reminders; python manage.py fill_storage_advice --limit 3; sleep 60; done"
    healthcheck:
      disable: true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: naatal_web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: naatal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  static_volume:
