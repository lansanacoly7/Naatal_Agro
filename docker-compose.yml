version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: naatal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-naatal_agro_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-naatal_agro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naatal_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-naatal-agro-sn-2026}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,naatal_backend,nginx,naatal-agro.sn}
      - USE_POSTGRES=True
      - DB_NAME=${DB_NAME:-naatal_agro_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://naatal-agro.sn}
      - API_KEY_OPENWEATHER=${API_KEY_OPENWEATHER:-}
      - API_KEY_GROQ=${API_KEY_GROQ:-}
      - API_KEY_GEMINI=${API_KEY_GEMINI:-}
      - SECURE_SSL_REDIRECT=False
    volumes:
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 core.wsgi:application"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: naatal_web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: naatal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  static_volume:
