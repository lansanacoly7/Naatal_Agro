# ==============================================================================
# Naatal Agro — nginx en production avec HTTPS (certificat Let's Encrypt)
# Utilisé via docker-compose.tls.yml ; la configuration HTTP seule (nginx.conf) reste réservée au développement.
# ==============================================================================
upstream backend {
    server backend:8000;
}

upstream frontend {
    server web:80;
}

# --- Port 80 : défi ACME (obtention/renouvellement du certificat) et redirection vers HTTPS --------------------------
server {
    listen 80;
    server_name naatal-agro.sn *.naatal-agro.sn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sonde de santé interne (Docker) : reste en clair, ne renvoie aucune donnée
    location = /health/ {
        proxy_pass http://backend/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;  # évite que Django redirige la sonde vers HTTPS
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 : l'application ---------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name naatal-agro.sn *.naatal-agro.sn;

    ssl_certificate     /etc/letsencrypt/live/naatal-agro.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naatal-agro.sn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # En-têtes de sécurité. HSTS : durée progressive (voir docs/11-DevOps-Deployment.md), à n'augmenter qu'une fois
    # HTTPS vérifié sur tous les sous-domaines. « preload » volontairement absent.
    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health/ {
        proxy_pass http://backend/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
